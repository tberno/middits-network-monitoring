# Oxidized config download proxy
#
# Preferred public URL:
#   /oxidized-download/<group>/<node>/<download_filename>.txt
#
# Backend URL:
#   http://127.0.0.1:8888/node/fetch/<group>/<node>
#
# Example:
#   /oxidized-download/junos/140.233.100.10/aggregation-a.txt

location ~ ^/oxidized-download/(?<group>[^/]+)/(?<node>[^/]+)/(?<download_file>[^/]+\.txt)$ {
    proxy_pass http://127.0.0.1:8888/node/fetch/$group/$node;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    default_type text/plain;
    add_header Content-Disposition "attachment; filename=\"$download_file\"" always;
}

# Legacy fallback:
#   /oxidized-download/<group>/<node>
location ~ ^/oxidized-download/(?<group>[^/]+)/(?<node>[^/]+)$ {
    proxy_pass http://127.0.0.1:8888/node/fetch/$group/$node;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    default_type text/plain;
    add_header Content-Disposition "attachment; filename=\"$node.txt\"" always;
}
